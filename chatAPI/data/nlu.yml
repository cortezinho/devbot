version: "3.1"

nlu:
- intent: saudacao
  exemples: 
    - oi
    - olá
    - ei
    - e aí?
    - tudo bem?
    - como vai?
    - bom dia
    - boa tarde
    - boa noite
    - blz!

- intent: despedida
  exemples: |
    - valeu
    - até mais
    - inté 
    - inté+
    - tchau
    - adeus
    - te vejo por aí

- intent: pergunta_clima
  exemples: |
    - Como está o tempo
    - Pode me falar sobre o tempo
    - Me dê a previsão do tempo
    - Como será o clima hoje
    - Como será o tempo hoje

- intent: informa_localizacao
  exemples: |
    - [London] (city)
    - [Berlim] (city)
    - [Chicago] (city)
    - [Boston] (city)

- intent: desafia_bot
  exemples: |
    - O que é voce
    - Quem você pensa que é
    - Você parece doido
    - Você parece estranho