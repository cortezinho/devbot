version: "3.1" #versão do schema YAML utilizado pelo Rasa para a interpretação do NLU

nlu: # bloco principal contendo os exemplos de treinamentos para os intents
- intent: saudacao # intenção que apresenta uma saudação do usuario
  examples: | # exemplos de frases que apresentam essa intenção
    - oi
    - olá
    - bom dia
    - boa tarde

- intent: buscar_livro_por_titulo # intenção de buscar livros com base no titulo
  examples: | # exemplos com a entidade "titulo" anotada
    - quero um livro chamado [Dom Casmurro](titulo) # busca por titulo especifico
    - estou procurando o livro [1984](titulo)
    - tem o livro [O Pequeno Príncipe](titulo) # pergunta sobre a disponibilidade de um titulo

- intent: buscar_livro_por_autor
  examples: | 
    - quero livros do [Machado de Assis](autor) # solicitação por obra de um autor especifico
    - me mostre obras escritas por [J.K Rowlig](autor)

- intent: buscar_livro_por_assunto
  examples: | 
    - quero livros de [terror](assunto) # solicitação por obra de um assunto especifico
    - me mostre obras sobre [fantasia](assunto)

- intent: despedida
  examples: |
    - tchau
    - até mais
    - falouu